name = "recommended"

# Every known check is explicit so a policy change is reviewable here.
# allow_override governs member repositories only; a fleet that extends this
# library may redefine anything it inherits.
#
# Checks left off here are deliberate: a specific linter (Vale, Stylelint) or an
# Ordnung-specific convention is a house preference, not something a tier other
# people adopt should mandate. A fleet raises those for itself.
[policy.checks]
action-badge = { severity = "off", allow_override = true }
allow-auto-merge = { severity = "required", allow_override = false }
artifacts-built = { severity = "required", allow_override = true }
auto-update-pr-branches = { severity = "required", allow_override = false }
branch-protection = { severity = "required", allow_override = false }
builds = { severity = "required", allow_override = false }
changelog = { severity = "required", allow_override = true }
ci-continue-on-error = { severity = "required", allow_override = false }
ci-exists = { severity = "required", allow_override = false }
ci-green = { severity = "required", allow_override = false }
ci-job-timeout = { severity = "required", allow_override = false }
ci-scheduled-run = { severity = "required", allow_override = false }
ci-scoped = { severity = "required", allow_override = true }
codegen-drift = { severity = "required", allow_override = true }
codeowners = { severity = "required", allow_override = false }
codespell = { severity = "required", allow_override = true }
conventional-commits = { severity = "required", allow_override = false }
dependabot = { severity = "required", allow_override = false }
dependabot-automerge = { severity = "required", allow_override = true }
field-guide = { severity = "off", allow_override = true }
git-hooks = { severity = "off", allow_override = true }
gitignore = { severity = "required", allow_override = false }
license = { severity = "required", allow_override = false }
lockfiles = { severity = "required", allow_override = false }
pinned-actions = { severity = "required", allow_override = false }
pinned-dependencies = { severity = "required", allow_override = false }
project-inventory = { severity = "required", allow_override = false }
readme = { severity = "required", allow_override = false }
readme-quality = { severity = "required", allow_override = true }
repo-meta = { severity = "required", allow_override = false }
reproducible-toolchain = { severity = "required", allow_override = false }
required-checks = { severity = "required", allow_override = false }
# Reported, not gated. The libraries below are declared so automated
# refactoring can rely on them, which is a real intent — but nothing in this
# fleet imports any of them today, so requiring them means adding an unused
# dependency to every crate and every site: compile time, audit surface, and a
# lockfile entry, bought for a convenience nobody is currently spending.
# Raise it to required in a fleet whose tooling actually reaches for them.
required-dependencies = { severity = "recommended", allow_override = true }
ruleset-bypass = { severity = "required", allow_override = false }
scripts = { severity = "required", allow_override = true }
secret-scanning = { severity = "required", allow_override = false }
stale = { severity = "required", allow_override = true }
stray-files = { severity = "off", allow_override = false }
strict-status-checks = { severity = "required", allow_override = false }
stylelint = { severity = "off", allow_override = true }
test-inline = { severity = "off", allow_override = true }
test-mirror = { severity = "off", allow_override = true }
test-retry-masking = { severity = "required", allow_override = false }
typecheck = { severity = "required", allow_override = false }
vale = { severity = "off", allow_override = true }
website = { severity = "off", allow_override = true }
workflow-permissions = { severity = "required", allow_override = false }

[policy.github.delete_branch_on_merge]
value = true
allow_override = false

[policy.github.allow_update_branch]
value = true
allow_override = false

# Libraries every project of a language must depend on, so that automated
# refactoring can rely on them being available. Names are registry-specific,
# which is why each entry selects a single language or ecosystem.
[[dependency]]
name = "rust-refactoring"
language = "rust"
require = ["itertools"]

[[dependency]]
name = "typescript-refactoring"
language = "typescript"
require = ["remeda", "ts-pattern", "zod"]

# A repository still finding its shape. Committing straight to the default branch
# is how the work actually happens, and there are no consumers yet to owe a
# changelog, a licence, or a stable commit convention to.
#
# Deliberately small, and deliberately not touching hygiene or security: a secret
# committed to an incubating repository is just as leaked, and an unpinned Action
# is just as exploitable. What relaxes here is ceremony.
#
# Lives in this tier so that `paranoid` inherits it too. Stage overlays apply after
# every inherited layer merges, so this holds even where a tier escalated the check.
[policy.stages.incubating.checks]
# Pull-request governance, which presumes a pull-request flow exists.
branch-protection = { severity = "off", allow_override = false }
required-checks = { severity = "off", allow_override = false }
strict-status-checks = { severity = "off", allow_override = false }
ruleset-bypass = { severity = "off", allow_override = false }
auto-update-pr-branches = { severity = "off", allow_override = false }

# Owed to consumers who do not exist yet.
changelog = { severity = "off", allow_override = true }
license = { severity = "recommended", allow_override = true }
readme-quality = { severity = "off", allow_override = true }
conventional-commits = { severity = "off", allow_override = true }

# Team process without a team.
codeowners = { severity = "off", allow_override = true }
stale = { severity = "off", allow_override = true }

# ---------------------------------------------------------------------------
# Content
#
# A tier that raises a check and then leaves every adopter to invent the file
# that satisfies it has done half a job. These entries ship the other half: the
# configuration a repository would otherwise write from scratch to pass the
# checks above. Ordnung distributes them to members on `fleet sync`.
#
# A fleet that wants its own version of any of these overrides the entry by
# name in its own fleet.toml — the last layer to declare a name wins — or drops
# it with `state = "unmanaged"`.

[[managed]]
name = "githooks-commit-msg"
source = "managed/githooks/commit-msg"
destination = ".githooks/commit-msg"
relative_to = "repo"

[[managed]]
name = "githooks-pre-commit"
source = "managed/githooks/pre-commit"
destination = ".githooks/pre-commit"
relative_to = "repo"

[[managed]]
name = "githooks-readme"
source = "managed/githooks/README.md"
destination = ".githooks/README.md"
relative_to = "repo"

[[managed]]
name = "dependabot"
source = "managed/github/dependabot.yml"
destination = ".github/dependabot.yml"
relative_to = "repo"

[[managed]]
name = "fleet-lint-workflow"
source = "managed/github/lint.yml"
destination = ".github/workflows/fleet-lint.yml"
relative_to = "repo"

[[managed]]
name = "typescript-tsconfig-base"
source = "managed/typescript/tsconfig.base.json"
destination = "tsconfig.base.json"
relative_to = "project"
when = { language = "typescript" }

[[managed]]
name = "typescript-biome-base"
source = "managed/typescript/biome.base.json"
destination = "biome.base.json"
relative_to = "project"
when = { language = "typescript" }
