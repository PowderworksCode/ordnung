name: Release

# Publishing is a deliberate act: a release exists only when a version tag is
# pushed. Nothing here runs on ordinary pushes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The release is drafted first so the platform jobs have somewhere to upload,
  # and published only once every one of them succeeded. A run that dies halfway
  # leaves a draft, not a release advertising binaries that do not exist.
  draft:
    name: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  build:
    name: build (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    # aarch64-unknown-linux-gnu is deliberately absent: it needs either a cross
    # linker or an ARM runner. Those platforms fall back to building from source,
    # which the Action does on its own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No build cache here, deliberately: a cache is writable from other
      # workflows, and these binaries are the release. Cold builds are the
      # price of artifacts nothing else could have written to (zizmor's
      # cache-poisoning audit).
      - name: Build
        run: cargo build --release --locked --package ordnung-cli

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="ordnung-${TAG}-${TARGET}.tar.gz"
          tar -czf "$archive" -C target/release ordnung
          # shasum is present on both macOS and Ubuntu runners; sha256sum is not.
          shasum -a 256 "$archive" > "${archive}.sha256"
          gh release upload "$TAG" "$archive" "${archive}.sha256" --clobber

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
